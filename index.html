<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Robbo">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Robbo — Productivity Tracker</title>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface-2: #334155;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --border: #334155;
    --safe-top: env(safe-area-inset-top);
    --safe-bottom: env(safe-area-inset-bottom);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
  }
  body {
    min-height: 100vh;
    padding-top: var(--safe-top);
    padding-bottom: calc(64px + var(--safe-bottom));
  }
  header {
    padding: 16px 20px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.5px;
  }
  header .date {
    font-size: 14px;
    color: var(--muted);
  }
  main { padding: 0 20px; }

  /* Score ring */
  .score-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 16px 0 24px;
  }
  .ring {
    width: 160px; height: 160px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: conic-gradient(var(--ring-color, #ef4444) calc(var(--pct, 0) * 1%), var(--surface) 0);
    transition: background 0.4s ease;
  }
  .ring-inner {
    width: 130px; height: 130px;
    border-radius: 50%;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .ring-pct {
    font-size: 36px;
    font-weight: 700;
  }
  .ring-sub {
    font-size: 13px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* Task list */
  .tasks { list-style: none; padding: 0; margin: 0; }
  .task {
    display: flex;
    align-items: center;
    background: var(--surface);
    padding: 14px 16px;
    border-radius: 12px;
    margin-bottom: 8px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }
  .task:active { background: var(--surface-2); }
  .task .check {
    width: 24px; height: 24px;
    border: 2px solid var(--muted);
    border-radius: 6px;
    margin-right: 14px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .task.done .check {
    background: #22c55e;
    border-color: #22c55e;
  }
  .task.done .check::after {
    content: '';
    width: 6px; height: 12px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
    margin-bottom: 3px;
  }
  .task .label {
    flex: 1;
    font-size: 16px;
  }
  .task.done .label {
    color: var(--muted);
    text-decoration: line-through;
  }

  /* Calendar */
  .cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 8px 0 12px;
  }
  .cal-header button {
    background: var(--surface);
    border: none;
    color: var(--text);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
  }
  .cal-month {
    font-size: 17px;
    font-weight: 600;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .cal-dow {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    padding: 4px 0;
  }
  .cal-day {
    aspect-ratio: 1;
    border-radius: 8px;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    position: relative;
    border: 2px solid transparent;
  }
  .cal-day.empty { background: transparent; cursor: default; }
  .cal-day.today { border-color: var(--accent); }
  .cal-day.future { opacity: 0.3; cursor: default; }

  /* Day detail */
  .detail-date {
    font-size: 20px;
    font-weight: 600;
    margin: 16px 0 4px;
  }
  .detail-score {
    color: var(--muted);
    margin-bottom: 16px;
  }

  /* Settings */
  .settings-task {
    display: flex;
    align-items: center;
    background: var(--surface);
    padding: 8px 12px;
    border-radius: 10px;
    margin-bottom: 8px;
  }
  .settings-task input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 16px;
    padding: 8px;
    outline: none;
  }
  .settings-task button {
    background: transparent;
    border: none;
    color: #ef4444;
    font-size: 22px;
    cursor: pointer;
    padding: 4px 10px;
  }
  .btn {
    background: var(--accent);
    color: #0f172a;
    border: none;
    padding: 12px 18px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin: 4px 4px 4px 0;
  }
  .btn.secondary {
    background: var(--surface);
    color: var(--text);
  }
  .section-title {
    font-size: 13px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin: 24px 0 8px;
    font-weight: 600;
  }

  /* Bottom nav */
  nav.bottom {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--surface);
    display: flex;
    justify-content: space-around;
    border-top: 1px solid var(--border);
    padding-bottom: var(--safe-bottom);
    z-index: 10;
  }
  nav.bottom button {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 12px 0;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  nav.bottom button.active { color: var(--accent); }
  nav.bottom .icon { font-size: 22px; }

  .hidden { display: none !important; }

  /* Modal-ish full overlay for day detail */
  .day-detail-back {
    color: var(--accent);
    background: none;
    border: none;
    font-size: 15px;
    padding: 0;
    margin-bottom: 8px;
    cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <h1>ROBBO</h1>
  <span class="date" id="headerDate"></span>
</header>

<main>
  <!-- TODAY VIEW -->
  <section id="view-today">
    <div class="score-wrap">
      <div class="ring" id="ring">
        <div class="ring-inner">
          <div class="ring-pct" id="ringPct">0%</div>
          <div class="ring-sub" id="ringSub">0 / 0</div>
        </div>
      </div>
    </div>
    <ul class="tasks" id="taskList"></ul>
  </section>

  <!-- HISTORY VIEW -->
  <section id="view-history" class="hidden">
    <div id="cal-view">
      <div class="cal-header">
        <button id="prevMonth">‹</button>
        <span class="cal-month" id="calMonth"></span>
        <button id="nextMonth">›</button>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
    <div id="day-detail" class="hidden">
      <button class="day-detail-back" id="backToCal">‹ Back</button>
      <div class="detail-date" id="detailDate"></div>
      <div class="detail-score" id="detailScore"></div>
      <ul class="tasks" id="detailTasks"></ul>
    </div>
  </section>

  <!-- SETTINGS VIEW -->
  <section id="view-settings" class="hidden">
    <div class="section-title">Daily Tasks</div>
    <div id="settingsTasks"></div>
    <button class="btn secondary" id="addTask">+ Add Task</button>

    <div class="section-title">Backup</div>
    <button class="btn" id="exportBtn">Export Data</button>
    <button class="btn secondary" id="importBtn">Import Data</button>
    <input type="file" id="importFile" accept="application/json" style="display:none">

    <div class="section-title">Danger</div>
    <button class="btn secondary" id="resetBtn" style="color:#ef4444">Erase All Data</button>
  </section>
</main>

<nav class="bottom">
  <button data-view="today" class="active"><span class="icon">○</span><span>Today</span></button>
  <button data-view="history"><span class="icon">▦</span><span>History</span></button>
  <button data-view="settings"><span class="icon">⚙</span><span>Settings</span></button>
</nav>

<script>
const STORAGE_KEY = 'robbo.v1';
const DEFAULT_TASKS = [
  'Exercise / movement',
  'Read for 20 min',
  '8 hours sleep',
  'No screens before bed',
  'Eat well',
  'Drink water',
  'Meditate / reflect',
  'Deep work block',
  'Connect with someone',
  'Tidy space'
];

let state = load();

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (!parsed.tasks) parsed.tasks = [...DEFAULT_TASKS];
      if (!parsed.history) parsed.history = {};
      return parsed;
    }
  } catch (e) {}
  return { tasks: [...DEFAULT_TASKS], history: {} };
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function todayKey(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function getDay(key) {
  if (!state.history[key]) {
    state.history[key] = {
      tasks: [...state.tasks],
      completed: new Array(state.tasks.length).fill(false)
    };
  }
  const day = state.history[key];
  // If today's task list grew/shrunk, reconcile only for today
  if (key === todayKey()) {
    if (day.tasks.length !== state.tasks.length || day.tasks.some((t, i) => t !== state.tasks[i])) {
      const newCompleted = state.tasks.map((t, i) => {
        const oldIdx = day.tasks.indexOf(t);
        return oldIdx >= 0 ? day.completed[oldIdx] : false;
      });
      day.tasks = [...state.tasks];
      day.completed = newCompleted;
    }
  }
  return day;
}

function dayPct(key) {
  const day = state.history[key];
  if (!day || day.tasks.length === 0) return null;
  const done = day.completed.filter(Boolean).length;
  return done / day.tasks.length;
}

function colorForPct(pct) {
  // 0% red → 50% yellow → 100% green
  let r, g, b = 80;
  if (pct < 0.5) {
    const t = pct / 0.5;
    r = 239;
    g = Math.round(68 + (191 - 68) * t);
  } else {
    const t = (pct - 0.5) / 0.5;
    r = Math.round(239 - (239 - 34) * t);
    g = Math.round(191 + (197 - 191) * t);
    b = Math.round(80 + (94 - 80) * t);
  }
  return `rgb(${r}, ${g}, ${b})`;
}

/* ---------- Today view ---------- */
function renderToday() {
  const key = todayKey();
  const day = getDay(key);
  const list = document.getElementById('taskList');
  list.innerHTML = '';
  day.tasks.forEach((t, i) => {
    const li = document.createElement('li');
    li.className = 'task' + (day.completed[i] ? ' done' : '');
    li.innerHTML = `<div class="check"></div><div class="label"></div>`;
    li.querySelector('.label').textContent = t;
    li.addEventListener('click', () => {
      day.completed[i] = !day.completed[i];
      save();
      renderToday();
    });
    list.appendChild(li);
  });
  const done = day.completed.filter(Boolean).length;
  const total = day.tasks.length;
  const pct = total ? done / total : 0;
  const ring = document.getElementById('ring');
  ring.style.setProperty('--pct', Math.round(pct * 100));
  ring.style.setProperty('--ring-color', colorForPct(pct));
  document.getElementById('ringPct').textContent = Math.round(pct * 100) + '%';
  document.getElementById('ringSub').textContent = `${done} / ${total}`;
}

/* ---------- History / calendar ---------- */
let viewMonth = new Date();
viewMonth.setDate(1);

function renderCalendar() {
  document.getElementById('cal-view').classList.remove('hidden');
  document.getElementById('day-detail').classList.add('hidden');
  const monthName = viewMonth.toLocaleString(undefined, { month: 'long', year: 'numeric' });
  document.getElementById('calMonth').textContent = monthName;
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  ['M','T','W','T','F','S','S'].forEach(d => {
    const el = document.createElement('div');
    el.className = 'cal-dow';
    el.textContent = d;
    grid.appendChild(el);
  });
  const year = viewMonth.getFullYear();
  const month = viewMonth.getMonth();
  const first = new Date(year, month, 1);
  // Monday-first
  let offset = (first.getDay() + 6) % 7;
  for (let i = 0; i < offset; i++) {
    const e = document.createElement('div');
    e.className = 'cal-day empty';
    grid.appendChild(e);
  }
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayStr = todayKey();
  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(year, month, d);
    const key = todayKey(date);
    const cell = document.createElement('div');
    cell.className = 'cal-day';
    cell.textContent = d;
    if (key === todayStr) cell.classList.add('today');
    if (date > new Date()) cell.classList.add('future');
    const pct = dayPct(key);
    if (pct !== null) {
      cell.style.background = colorForPct(pct);
      cell.style.color = pct > 0.5 ? '#0f172a' : '#fff';
    }
    if (date <= new Date()) {
      cell.addEventListener('click', () => showDayDetail(key));
    }
    grid.appendChild(cell);
  }
}

function showDayDetail(key) {
  document.getElementById('cal-view').classList.add('hidden');
  document.getElementById('day-detail').classList.remove('hidden');
  const day = state.history[key];
  const date = new Date(key + 'T00:00:00');
  document.getElementById('detailDate').textContent = date.toLocaleDateString(undefined, {
    weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
  });
  const list = document.getElementById('detailTasks');
  list.innerHTML = '';
  if (!day) {
    document.getElementById('detailScore').textContent = 'No data for this day.';
    return;
  }
  const done = day.completed.filter(Boolean).length;
  const total = day.tasks.length;
  const pct = total ? done / total : 0;
  document.getElementById('detailScore').textContent =
    `${done} / ${total} tasks — ${Math.round(pct * 100)}%`;
  const isToday = key === todayKey();
  day.tasks.forEach((t, i) => {
    const li = document.createElement('li');
    li.className = 'task' + (day.completed[i] ? ' done' : '');
    li.innerHTML = `<div class="check"></div><div class="label"></div>`;
    li.querySelector('.label').textContent = t;
    if (isToday) {
      li.addEventListener('click', () => {
        day.completed[i] = !day.completed[i];
        save();
        showDayDetail(key);
      });
    } else {
      li.style.cursor = 'default';
    }
    list.appendChild(li);
  });
}

/* ---------- Settings ---------- */
function renderSettings() {
  const wrap = document.getElementById('settingsTasks');
  wrap.innerHTML = '';
  state.tasks.forEach((t, i) => {
    const row = document.createElement('div');
    row.className = 'settings-task';
    const input = document.createElement('input');
    input.type = 'text';
    input.value = t;
    input.addEventListener('change', () => {
      state.tasks[i] = input.value.trim() || 'Untitled';
      save();
    });
    const del = document.createElement('button');
    del.textContent = '×';
    del.addEventListener('click', () => {
      if (!confirm(`Delete "${state.tasks[i]}"?`)) return;
      state.tasks.splice(i, 1);
      save();
      renderSettings();
    });
    row.appendChild(input);
    row.appendChild(del);
    wrap.appendChild(row);
  });
}

document.getElementById('addTask').addEventListener('click', () => {
  state.tasks.push('New task');
  save();
  renderSettings();
});

document.getElementById('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `robbo-backup-${todayKey()}.json`;
  a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data.tasks || !data.history) throw new Error('Invalid file');
      if (!confirm('This will replace all current data. Continue?')) return;
      state = data;
      save();
      renderAll();
      alert('Imported successfully.');
    } catch (err) {
      alert('Import failed: ' + err.message);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('Erase ALL data including history? This cannot be undone.')) return;
  if (!confirm('Really sure?')) return;
  localStorage.removeItem(STORAGE_KEY);
  state = load();
  renderAll();
});

/* ---------- Navigation ---------- */
document.querySelectorAll('nav.bottom button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav.bottom button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const view = btn.dataset.view;
    document.getElementById('view-today').classList.toggle('hidden', view !== 'today');
    document.getElementById('view-history').classList.toggle('hidden', view !== 'history');
    document.getElementById('view-settings').classList.toggle('hidden', view !== 'settings');
    if (view === 'today') renderToday();
    if (view === 'history') renderCalendar();
    if (view === 'settings') renderSettings();
  });
});

document.getElementById('prevMonth').addEventListener('click', () => {
  viewMonth.setMonth(viewMonth.getMonth() - 1);
  renderCalendar();
});
document.getElementById('nextMonth').addEventListener('click', () => {
  viewMonth.setMonth(viewMonth.getMonth() + 1);
  renderCalendar();
});
document.getElementById('backToCal').addEventListener('click', renderCalendar);

function renderAll() {
  document.getElementById('headerDate').textContent =
    new Date().toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  renderToday();
}

renderAll();

/* Service worker for offline */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
